[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pevaluate"
version = "0.1.7"
description = "Automated correction pipeline for JupyterLab sessions using LLMs"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv",
    "tenacity",
    "jupyter",
    "matplotlib",
    "Markdown",
    "nbconvert",
    "playwright",
    "pymdown-extensions",
    "python-docx",
    "python-pptx @ git+https://github.com/OscarPellicer/python-pptx.git",
    "pypdf",
    "pymupdf4llm",
    "PyYAML"
]

[tool.pytest.ini_options]
markers = [
    "llm: tests that call a real LLM provider and may burn API credits",
]

[project.scripts]
autocorrect = "autocorrect.cli:main"
pevaluate = "autocorrect.cli:main"

[project.urls]
Homepage = "https://github.com/OscarPellicer/pevaluate"

[tool.setuptools.packages.find]
where = ["src"]
