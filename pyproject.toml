[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pevaluate"
version = "0.3.1"
description = "Automated correction pipeline for JupyterLab sessions using LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow",
    "anthropic>=1.0.0",
    "openai>=1.0.0",
    "python-dotenv",
    "nbformat",
    "matplotlib",
    "Markdown",
    "nbconvert",
    "pandas",
    "openpyxl",
    "xlrd",
    "xlwt",
    "pymupdf",
    "playwright",
    "pymdown-extensions",
    "python-docx",
    "python-pptx>=1.0.0",
    "pypdf",
    "pymupdf4llm",
    "PyYAML"
]

[tool.pytest.ini_options]
markers = [
    "llm: tests that call a real LLM provider and may burn API credits",
]

[project.scripts]
autocorrect = "autocorrect.cli:main"
pevaluate = "autocorrect.cli:main"

[project.urls]
Homepage = "https://github.com/OscarPellicer/pevaluate"

[tool.setuptools.packages.find]
where = ["src"]
